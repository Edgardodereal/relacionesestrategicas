<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Propiedad - Red Inmobiliaria</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        textarea {
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #1d4ed8;
        }

        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .mensaje-estado {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .mensaje-exito {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .mensaje-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-header">
        <h2>Registro de Solicitud Requerida</h2>
        <p>Completa los campos para ingresar el requerimiento a la base de datos.</p>
    </div>

    <form id="form-solicitud" onsubmit="enviarSolicitud(event)">
        
        <!-- Nombre del Agente -->
        <div class="form-group">
            <label for="nombre">Nombre del Agente *</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Edgardo Romero" required>
        </div>

        <!-- Teléfono y Correo -->
        <div class="form-row">
            <div class="form-group">
                <label for="telefono">Teléfono (WhatsApp) *</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. 9981234567" required>
            </div>
            <div class="form-group">
                <label for="correo">Correo Electrónico *</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>
        </div>

        <!-- Agencia y Presupuesto -->
        <div class="form-row">
            <div class="form-group">
                <label for="agencia">Agencia Inmobiliaria</label>
                <input type="text" id="agencia" name="agencia" placeholder="Nombre de la agencia">
            </div>
            <div class="form-group">
                <label for="presupuesto">Presupuesto *</label>
                <input type="text" id="presupuesto" name="presupuesto" placeholder="Ej. $3,500,000 MXN" required>
            </div>
        </div>

        <!-- Tipo de Propiedad y Ubicación -->
        <div class="form-row">
            <div class="form-group">
                <label for="tipo_propiedad">Tipo de Propiedad *</label>
                <select id="tipo_propiedad" name="tipo_propiedad" required>
                    <option value="">Selecciona una opción...</option>
                    <option value="Departamento">Departamento</option>
                    <option value="Casa">Casa</option>
                    <option value="Terreno">Terreno / Macrolote</option>
                    <option value="Villa">Villa</option>
                    <option value="Local Comercial">Local Comercial</option>
                    <option value="Oficina">Oficina</option>
                </select>
            </div>
            <div class="form-group">
                <label for="ubicacion">Ubicación Requerida *</label>
                <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej. Cancún Centro, Tulum, etc." required>
            </div>
        </div>

        <!-- Habitaciones y Baños -->
        <div class="form-row">
            <div class="form-group">
                <label for="habitaciones">Habitaciones</label>
                <input type="number" id="habitaciones" name="habitaciones" min="0" placeholder="Ej. 3">
            </div>
            <div class="form-group">
                <label for="banos">Baños</label>
                <input type="number" id="banos" name="banos" min="0" step="0.5" placeholder="Ej. 2.5">
            </div>
        </div>

        <!-- Metros Terreno y Metros Construcción -->
        <div class="form-row">
            <div class="form-group">
                <label for="m2_terreno">Metros de Terreno (m²)</label>
                <input type="number" id="m2_terreno" name="m2_terreno" min="0" placeholder="Ej. 200">
            </div>
            <div class="form-group">
                <label for="m2_construccion">Metros de Construcción (m²)</label>
                <input type="number" id="m2_construccion" name="m2_construccion" min="0" placeholder="Ej. 180">
            </div>
        </div>

        <!-- Detalles Adicionales -->
        <div class="form-group">
            <label for="detalles">Comentarios / Detalles</label>
            <textarea id="detalles" name="detalles" rows="3" placeholder="Amenidades específicas, forma de pago, fecha estimada de compra, etc."></textarea>
        </div>

        <button type="submit" id="btn-enviar" class="btn-submit">Enviar Solicitud</button>
    </form>

    <div id="mensaje" class="mensaje-estado"></div>
</div>

<script>
    // URL de tu Apps Script Web App
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz6IRM7wp0AurAOsrMPPeCzPtnVBbOaK0p9gqPKUbLEe9MHao5lSTyqnlMi_IR9gawT4A/exec';

    async function enviarSolicitud(event) {
        event.preventDefault();

        const form = document.getElementById('form-solicitud');
        const btn = document.getElementById('btn-enviar');
        const mensajeDiv = document.getElementById('mensaje');

        // Estado de carga
        btn.disabled = true;
        btn.innerText = 'Guardando en Sheets...';
        mensajeDiv.style.display = 'none';

        const formData = new FormData(form);
        formData.append('accion', 'nueva_solicitud');

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: formData
            });

            const textoResultado = await response.text();

            if (textoResultado.trim() === 'Éxito') {
                mensajeDiv.className = 'mensaje-estado mensaje-exito';
                mensajeDiv.innerText = '¡Solicitud registrada correctamente en Google Sheets!';
                mensajeDiv.style.display = 'block';
                form.reset();
            } else {
                throw new Error(textoResultado);
            }
        } catch (error) {
            mensajeDiv.className = 'mensaje-estado mensaje-error';
            mensajeDiv.innerText = 'Error al registrar: ' + error.message;
            mensajeDiv.style.display = 'block';
        } finally {
            btn.disabled = false;
            btn.innerText = 'Enviar Solicitud';
        }
    }
</script>

</body>
</html>
